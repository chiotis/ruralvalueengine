# nginx site for the engine. Replace engine.ruralgreece.gr with the real host name.
# Install:  sudo cp deploy/nginx-rve.conf /etc/nginx/sites-available/rve
#           sudo ln -s /etc/nginx/sites-available/rve /etc/nginx/sites-enabled/rve
#           sudo nginx -t && sudo systemctl reload nginx
# Then HTTPS (certbot adds the 443 block and the redirect):
#           sudo certbot --nginx -d engine.ruralgreece.gr
server {
    listen 80;
    server_name engine.ruralgreece.gr;

    client_max_body_size 1m;

    # Optional: only ETAM's office can open the admin panel and admin API.
    # location ~ ^/(admin|v1/admin) {
    #     allow 203.0.113.10;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # a full content sync started from the admin panel can take a while
    }
}
